name: pattern-studio
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    REDIS_RESULT_URL: redis://redis:6379/1
    REDIS_CACHE_URL: redis://redis:6379/2
    DATA_ROOT: /data
  volumes:
    - results:/data
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: regex
      POSTGRES_USER: regex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regex"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    restart: "no"
    command: python manage.py migrate --noinput
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 10s
      retries: 12
  worker:
    <<: *app
    command: celery -A config worker --loglevel=WARNING --concurrency=1 --max-tasks-per-child=10 -E
    stop_grace_period: 70s
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: celery -A config beat --loglevel=WARNING --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  flower:
    <<: *app
    command: /bin/sh -c 'celery -A config flower --port=5555 --basic-auth=$$FLOWER_USER:$$FLOWER_PASSWORD'
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  redis:
  results:
